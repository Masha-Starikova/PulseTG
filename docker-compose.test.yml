# Изолированные Postgres и Redis только для тестов.
# Отдельное имя проекта, другие порты и tmpfs: dev-база и её том здесь не участвуют.
name: pulsetg-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsetg_test
      POSTGRES_USER: pulsetg_test
      POSTGRES_PASSWORD: pulsetg_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsetg_test -d pulsetg_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
