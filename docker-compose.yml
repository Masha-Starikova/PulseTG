services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsetg_frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pulsetg_net
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pulsetg_migrate
    command: alembic upgrade head
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulsetg_net
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pulsetg_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    volumes:
      - .:/app
      - ./app/telegram:/app/app/telegram
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pulsetg_net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pulsetg_worker
    # pool=solo нужен для стабильной работы с async-кодом и event loop внутри задач.
    command: celery -A backend.core.celery_app:celery_app worker --loglevel=INFO -Q audits --pool=solo
    env_file:
      - .env
    volumes:
      - .:/app
      - ./app/telegram:/app/app/telegram
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulsetg_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pulsetg_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsetg_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pulsetg_redis
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsetg_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  pulsetg_net:
    driver: bridge
