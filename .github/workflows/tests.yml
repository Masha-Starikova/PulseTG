name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Те же порты и учётные данные, что в docker-compose.test.yml. Это одноразовая
    # база CI, поэтому секреты не нужны.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulsetg_test
          POSTGRES_USER: pulsetg_test
          POSTGRES_PASSWORD: pulsetg_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U pulsetg_test -d pulsetg_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80
