[pytest]
testpaths = backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Запрещает любые исходящие соединения, кроме localhost (тестовые Postgres и Redis).
addopts = --strict-markers --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1
markers =
    integration: нужен настоящий Postgres и/или Redis из docker-compose.test.yml
